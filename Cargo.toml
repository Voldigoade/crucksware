[package]
name = "crucksware"
version = "0.1.0-dev.0"
edition = "2024"
description = "Semantic firmware diff and triage in Rust."
license = "MIT OR Apache-2.0"
repository = "https://github.com/Voldigoade/crucksware"
readme = "README.md"
publish = false

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"

[lints.rust]
unsafe_code = "forbid"

[dev-dependencies]
tempfile = "3.27.0"
