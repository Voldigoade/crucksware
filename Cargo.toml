[package]
name = "crucksware"
version = "0.2.0-beta.1"
edition = "2024"
description = "Semantic firmware diff and triage in Rust."
license = "MIT OR Apache-2.0"
repository = "https://github.com/Voldigoade/crucksware"
readme = "README.md"
publish = false

[dependencies]
clap = {
    version = "4.6.7",
    default-features = false,
    features = ["std", "derive", "help", "usage", "error-context"],
}
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
rustyline = { version = "18.0.1", default-features = false }
indicatif = { version = "0.18.6", default-features = false, features = ["unicode-width"] }
tempfile = "3.27.0"
object = {
    version = "0.40.0",
    default-features = false,
    features = ["read_core", "std", "elf", "pe"],
}

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2.191"
similar = "3.2.0"
tree-sitter = "0.27.0"
tree-sitter-c = "0.24.2"
tree-sitter-cpp = "0.23.4"
tree-sitter-python = "0.25.0"
tree-sitter-rust = "0.24.2"

[lints.rust]
unsafe_code = "forbid"

[dev-dependencies]
